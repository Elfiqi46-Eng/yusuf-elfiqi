<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yusuf ElFiqi | Engineer</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-gradient: linear-gradient(145deg,#1c1917 0%,#292524 50%,#1c1917 100%);
  --accent-primary:#d6c3b0; --text-dark:#fafaf9; --text-muted:#a8a29e;
  --card-bg:rgba(41,37,36,.9); --card-border:rgba(68,64,60,.85);
  --white-box:#292524; --shadow-soft:0 10px 28px -6px rgba(0,0,0,.55);
  --border-subtle:#44403c; --phone-bg:#3f3a36; --phone-color:#d6c3b0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg-gradient);color:var(--text-dark);min-height:100vh;display:flex;justify-content:center;padding:20px 15px}
.wrap{width:100%;max-width:480px;margin:auto;display:flex;flex-direction:column;gap:20px}
.header{display:flex;align-items:center}
.profile-tag{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.avatar-mini{width:38px;height:38px;border-radius:50%;background:var(--phone-bg);display:flex;align-items:center;justify-content:center;color:var(--accent-primary)}
.hero-card{background:var(--card-bg);backdrop-filter:blur(12px);border:1px solid var(--card-border);border-radius:28px;padding:24px 20px;display:flex;gap:16px;align-items:center;box-shadow:var(--shadow-soft)}
.hero-info{flex:1} .greeting{font-size:15px;color:var(--text-muted);font-weight:500}
.name{font-size:24px;font-weight:800;line-height:1.2;margin:4px 0 2px} .title{font-size:15px;color:var(--accent-primary);font-weight:700;margin-bottom:10px}
.quote{font-size:12px;color:var(--text-muted);font-style:italic;line-height:1.4;margin-bottom:14px}
.tags{display:flex;gap:8px;flex-wrap:wrap} .tag{background:var(--white-box);border:1px solid var(--border-subtle);padding:6px 12px;border-radius:99px;font-size:11px;font-weight:600}
.hero-photo{width:130px;height:175px;border-radius:20px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.35);flex-shrink:0;background:#3f3a36}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block}
.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.qa-card{background:var(--white-box);border-radius:20px;padding:16px 10px;text-align:center;text-decoration:none;color:var(--text-dark);box-shadow:var(--shadow-soft);border:1px solid var(--border-subtle)}
.qa-icon{width:46px;height:46px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center}
.qa-icon.facebook{background:#1877F2;color:#fff} .qa-icon.whatsapp{background:#25D366;color:#fff}
.qa-icon.instagram{background:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);color:#fff}
.qa-icon svg{width:23px;height:23px;display:block}
.qa-title{font-size:13px;font-weight:700;display:block} .qa-sub{font-size:10px;color:var(--text-muted);margin-top:2px;display:block}
.links-block{background:var(--white-box);border-radius:24px;padding:8px 16px;box-shadow:var(--shadow-soft);border:1px solid var(--border-subtle)}
.link-item{display:flex;align-items:center;gap:14px;padding:14px 0;text-decoration:none;color:var(--text-dark)}
.link-item:not(:last-child){border-bottom:1px solid var(--border-subtle)}
.link-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.link-icon.phone,.link-icon.save{background:var(--phone-bg);color:var(--phone-color)}
.link-text{flex:1} .link-title{font-size:14px;font-weight:700;display:block} .link-sub{font-size:12px;color:var(--text-muted)}
.arrow{color:var(--text-muted);font-size:18px} .footer-quote{text-align:center;padding:10px 0}
.credit{font-size:11px;font-weight:600;letter-spacing:.3px;opacity:.85;color:var(--accent-primary)}
@media(max-width:380px){.hero-photo{width:110px;height:155px}.name{font-size:21px}}
</style>

<style id="premium-upgrades">
:root{
  --premium-accent:#d6a86b;
  --premium-accent-2:#f1d3a3;
  --premium-bg:#0b0b0c;
}
body{
  background:
    radial-gradient(circle at 15% 10%, rgba(214,168,107,.14), transparent 28%),
    radial-gradient(circle at 90% 85%, rgba(241,211,163,.08), transparent 30%),
    linear-gradient(135deg,#080809,#151311 48%,#090909);
  background-size:180% 180%;
  animation: premiumBackground 16s ease-in-out infinite alternate;
}
@keyframes premiumBackground{
  from{background-position:0% 0%}
  to{background-position:100% 100%}
}
.card,.hero,.section,.social-card,.link-card,.service-card{
  background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035));
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 18px 55px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}
button,a,.social-card,.link-card,.service-card{
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease,background .25s ease;
}
button:hover,a:hover,.social-card:hover,.link-card:hover,.service-card:hover{
  transform:translateY(-4px);
  border-color:rgba(214,168,107,.65);
  box-shadow:0 12px 30px rgba(214,168,107,.14);
}
button:active,a:active{
  transform:translateY(-1px) scale(.98);
}
.hero,.card,.section,.social-card,.link-card,.service-card{
  animation:premiumReveal .7s both;
}
@keyframes premiumReveal{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}
.hero{animation-delay:.05s}
.social-card{animation-delay:.12s}
.link-card{animation-delay:.2s}
.service-card{animation-delay:.28s}
img{
  transition:transform .45s ease,filter .45s ease;
}
img:hover{
  transform:scale(1.025);
  filter:saturate(1.08) contrast(1.03);
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>


<style id="mobile-optimization">
html{scroll-behavior:smooth;overflow-x:hidden}
body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
*,*::before,*::after{box-sizing:border-box}
img,svg,video{max-width:100%;height:auto}
button,a,input,textarea,select{max-width:100%}
a,button{word-break:break-word}
@media (max-width:600px){
  body{padding-left:12px!important;padding-right:12px!important}
  main,.container,.wrapper,.content,.page,.app{
    width:100%!important;
    max-width:100%!important;
    min-width:0!important;
  }
  .hero,.card,.section,.social-card,.link-card,.service-card{
    width:100%!important;
    min-width:0!important;
    overflow:hidden;
  }
  .hero h1,.hero h2,.hero .title{
    font-size:clamp(1.55rem,7vw,2.25rem)!important;
    line-height:1.15!important;
    overflow-wrap:anywhere;
  }
  h1,h2,h3,p{overflow-wrap:anywhere}
  .socials,.social-links,.quick-links,.actions,.buttons{
    display:grid!important;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px!important;
  }
  .socials>a,.social-links>a,.quick-links>a,.actions>a,.buttons>a,
  .socials>button,.social-links>button,.quick-links>button,.actions>button,.buttons>button{
    min-width:0!important;
    width:100%!important;
  }
  table{display:block;max-width:100%;overflow-x:auto}
}
@media (max-width:360px){
  body{padding-left:9px!important;padding-right:9px!important}
  .socials,.social-links,.quick-links,.actions,.buttons{
    grid-template-columns:1fr;
  }
}
</style>
