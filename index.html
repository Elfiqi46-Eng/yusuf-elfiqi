<style>
:root{--accent:#e97832;--cream:#fff8f0;--ink:#202124;--muted:#777}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#fffaf5,#f7e6d6);color:var(--ink);min-height:100vh}
.wrap{max-width:460px;margin:auto;padding:28px 18px 36px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.logo{font-weight:900;font-size:20px} .connect{background:#fff;border:1px solid #eadfd5;padding:9px 13px;border-radius:999px;font-size:12px}

.role{display:inline-block;background:#fff0e5;color:#c75d1e;border-radius:999px;padding:8px 13px;font-weight:800;font-size:13px}
.bio{color:var(--muted);font-size:14px;line-height:1.6;margin:18px auto 24px;max-width:340px}
.actions{display:grid;gap:11px}
a{text-decoration:none;color:var(--ink);background:#fff;border:1px solid #eee0d4;border-radius:17px;padding:15px 17px;display:flex;align-items:center;gap:12px;font-weight:750;box-shadow:0 5px 15px rgba(70,40,20,.05)}
a.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.icon{font-size:20px;width:26px} .arrow{margin-left:auto;color:#aaa}
.nfc{margin-top:22px;background:#252525;color:#fff;border-radius:20px;padding:17px}
.nfc strong{display:block;margin-bottom:5px} .nfc span{font-size:12px;color:#cfcfcf}
footer{text-align:center;color:#999;font-size:11px;margin-top:20px}
</style>
